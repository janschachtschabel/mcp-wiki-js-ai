# =============================================================================
# Nur der MCP-Server — für ein Wiki.js, das schon läuft
# =============================================================================
# Kein Repo-Checkout, kein Build: fertiges Image aus GHCR. Startet ohne
# Variablen; MCP_SESSION_SECRET erzeugt der Dienst init beim ersten Start selbst
# (Volume stack-secrets). Danach setzen und neu starten:
#
#   DOMAIN      Hostname, unter dem Nutzer den MCP erreichen (ohne https://).
#               Am besten DERSELBE wie der des Wikis — dann reicht beim
#               Verbinden ein Klick, weil die Wiki-Anmeldung mitgilt. Eine eigene
#               Subdomain geht auch (Login dann per Formular).
#   WIKIJS_URL  wie der MCP-Server das Wiki erreicht (ohne /graphql), z. B.
#               https://wiki.example.org oder http://host.docker.internal:3000
#               (Default; Wiki.js mit Port 3000 auf demselben Host).
#
# Anbindung — eine von beiden:
#   a) Vorhandener Reverse-Proxy auf dem Host (nginx, Caddy, Apache …): leitet
#      die MCP-Pfade an http://127.0.0.1:${MCP_PORT:-3100} weiter.
#   b) Vorhandener Traefik (z. B. eines Docker-Panels): TRAEFIK_ENABLE=true —
#      Traefik routet die MCP-Pfade auf DOMAIN hierher, der Rest bleibt beim Wiki.
# MCP-Pfade: /mcp  /oauth/  /me  /_next/  /api/health
#   /.well-known/oauth-authorization-server  /.well-known/oauth-protected-resource
#   /.well-known/mcp.json
# Beispiele und alle Variablen: mcp-for-wiki-js/docs/installation-it.md.
#
# Bewusst schlicht für Web-Editoren: keine Pflicht-Variablen, keine Tabs, keine
# YAML-Anker, kein externes Netz.

services:
  # Erzeugt beim ersten Start MCP_SESSION_SECRET und leitet bei jedem Start die
  # öffentliche Adresse aus DOMAIN ab; beendet sich danach.
  init:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/standalone-init.mjs"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - stack-secrets:/stack/secrets

  mcp:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
    # MCP_SESSION_SECRET und PUBLIC_BASE_URL kommen aus den Dateien von init.
    command:
      - node
      - --env-file-if-exists=/stack/secrets/session.env
      - --env-file-if-exists=/stack/secrets/public.env
      - server.js
    ports:
      # Nur lokal: ein Reverse-Proxy auf dem Host spricht den MCP hier an.
      - "127.0.0.1:${MCP_PORT:-3100}:3000"
    extra_hosts:
      # Für WIKIJS_URL=http://host.docker.internal:<port> (Wiki.js auf demselben Host).
      - "host.docker.internal:host-gateway"
    environment:
      WIKIJS_URL: ${WIKIJS_URL:-http://host.docker.internal:3000}
      MCP_DATA_DIR: /data
      WIKIJS_PERMISSION_PRESET: ${WIKIJS_PERMISSION_PRESET:-full}
      WIKIJS_OAUTH_ROLE: ${WIKIJS_OAUTH_ROLE:-wiki}
      WIKIJS_BLOCKED_TAGS: ${WIKIJS_BLOCKED_TAGS:-kein-ki}
      WIKIJS_AUDIT: ${WIKIJS_AUDIT:-true}
      # Ein Wiki.js ohne angepassten DB-Pool hat max. 10 Verbindungen — darunter bleiben.
      WIKIJS_MAX_CONCURRENCY: ${WIKIJS_MAX_CONCURRENCY:-6}
      MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      # Sessions + Audit-Log (sqlite) — gehört zur Datensicherung, ebenso stack-secrets.
      - mcp-data:/data
      - stack-secrets:/stack/secrets:ro
    labels:
      # Nur mit TRAEFIK_ENABLE=true aktiv (Variante b); sonst ignoriert Traefik den Container.
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-wikijs-mcp-web}"
      - "traefik.http.routers.wikijs-mcponly.rule=Host(`${DOMAIN:-}`) && (Path(`/mcp`) || PathPrefix(`/mcp/`) || PathPrefix(`/oauth/`) || Path(`/me`) || PathPrefix(`/me/`) || Path(`/api/health`) || PathPrefix(`/_next/`) || PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/oauth-protected-resource`) || Path(`/.well-known/mcp.json`))"
      - "traefik.http.routers.wikijs-mcponly.priority=100"
      - "traefik.http.routers.wikijs-mcponly.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.wikijs-mcponly.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.wikijs-mcponly.middlewares=wikijs-mcponly-headers"
      - "traefik.http.routers.wikijs-mcponly.service=wikijs-mcponly"
      - "traefik.http.services.wikijs-mcponly.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.wikijs-mcponly-headers.headers.stsSeconds=31536000"

networks:
  # Eigenes Netz mit festem Namen (wird angelegt, falls es fehlt). Läuft Traefik
  # in einem eigenen Docker-Netz, dessen Namen als TRAEFIK_NETWORK setzen.
  default:
    name: ${TRAEFIK_NETWORK:-wikijs-mcp-web}

volumes:
  mcp-data:
  stack-secrets:
