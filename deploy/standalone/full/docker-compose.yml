# =============================================================================
# Wiki.js + MCP-Server — eigenständiger Komplett-Stack (ohne Repo-Checkout)
# =============================================================================
# Für Docker-Panels mit Compose-Import per URL (GitHub-Link auf diese Datei bzw.
# Repository + Pfad deploy/standalone/full), Portainer-Stacks oder einen vServer
# mit nichts als dieser Datei. Nichts wird gebaut, keine Repo-Datei eingebunden.
#
# Startet OHNE Variablen: Postgres-Passwort und MCP_SESSION_SECRET erzeugt der
# Dienst init beim ersten Start selbst (Volumes stack-secrets und mcp-secrets).
# Solange DOMAIN fehlt, zeigt die Seite einen Hinweis „noch nicht eingerichtet“.
#
# Backups: täglich Postgres + Secrets ins Volume db-backups, die MCP-Datenbank ins
# Volume mcp-backups — beide auf DIESEM Server; regelmäßig nach außen kopieren.
#
# Danach setzen (Panel: Projekt bearbeiten → Umgebungsvariablen; sonst .env):
#   DOMAIN          nur der Hostname, z. B. wiki.example.org
#   ADMIN_EMAIL     erstes Admin-Konto, wird beim nächsten Start angelegt
#   ADMIN_PASSWORD  nach der Einrichtung wieder entfernen
# Optional: BOOTSTRAP_ARGS (z. B. --locale=en oder --demo), HTTP_PORT/HTTPS_PORT,
#   WIKIJS_BLOCKED_TAGS, MCP_ALLOWED_REDIRECT_HOSTS, WIKIJS_MAX_CONCURRENCY,
#   MCP_IMAGE, BACKUP_INTERVAL_SECONDS, BACKUP_KEEP, TZ
#
# Voraussetzungen: DNS-Eintrag der Domain zeigt auf den Server; Ports 80 und
# 443 sind frei (Caddy holt das TLS-Zertifikat automatisch).
#
# Bewusst schlicht für Web-Editoren: keine Pflicht-Variablen, keine Tabs, keine
# YAML-Anker; Logik (Init, Ersteinrichtung, Caddyfile) liegt im MCP-Image.
# Mit Repo-Checkout ist ../../../docker-compose.yml die Variante zum Selbstbauen.

services:
  # Erzeugt beim ersten Start die Geheimnisse und schreibt bei jedem Start die
  # Caddy-Konfiguration für DOMAIN; beendet sich danach.
  init:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/standalone-init.mjs"]
    environment:
      DOMAIN: ${DOMAIN:-}
      # MCP_SESSION_SECRET in ein eigenes Volume, das Wiki.js nicht einbindet.
      MCP_SECRETS_DIR: /stack/mcp-secrets
    volumes:
      - stack-secrets:/stack/secrets
      - mcp-secrets:/stack/mcp-secrets
      # Nur eingebunden, damit Docker das frische Volume dem Nutzer 1000 gibt (wie
      # /backups im Image) — db-backup läuft dann ohne root.
      - db-backups:/backups
      - stack-caddy:/stack/caddy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD_FILE: /stack/secrets/postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - stack-secrets:/stack/secrets:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki:
    image: requarks/wiki:2
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # Ohne eigene config.yml gilt der DB-Pool des Images (max. 10 Verbindungen);
    # WIKIJS_MAX_CONCURRENCY beim MCP ist deshalb niedriger gesetzt.
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS_FILE: /stack/secrets/postgres_password
      DB_NAME: wiki
    # Nur das Volume mit DB-Passwort und öffentlicher Adresse — das MCP-Secret
    # liegt in mcp-secrets und ist für Wiki.js nicht erreichbar.
    volumes:
      - stack-secrets:/stack/secrets:ro
    networks:
      - default
      - db
    # /healthz antwortet auch im Setup-Modus; der erste Start migriert die Datenbank.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      # Großzügig: ein Update von Wiki.js kann die Datenbank minutenlang migrieren.
      retries: 20
      start_period: 180s

  mcp:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
      wiki:
        condition: service_started
    # MCP_SESSION_SECRET und PUBLIC_BASE_URL kommen aus den Dateien von init.
    command:
      - node
      # Ältere Images legen das Secret noch im gemeinsamen Volume ab: dann gilt diese
      # Datei; sonst gewinnt die spätere aus mcp-secrets.
      - --env-file-if-exists=/stack/secrets/session.env
      - --env-file-if-exists=/stack/mcp-secrets/session.env
      - --env-file-if-exists=/stack/secrets/public.env
      - server.js
    environment:
      WIKIJS_URL: http://wiki:3000
      MCP_DATA_DIR: /data
      WIKIJS_PERMISSION_PRESET: ${WIKIJS_PERMISSION_PRESET:-full}
      WIKIJS_OAUTH_ROLE: ${WIKIJS_OAUTH_ROLE:-wiki}
      WIKIJS_BLOCKED_TAGS: ${WIKIJS_BLOCKED_TAGS:-kein-ki}
      WIKIJS_AUDIT: ${WIKIJS_AUDIT:-true}
      WIKIJS_MAX_CONCURRENCY: ${WIKIJS_MAX_CONCURRENCY:-6}
      MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - mcp-data:/data
      - stack-secrets:/stack/secrets:ro
      - mcp-secrets:/stack/mcp-secrets:ro

  # Ersteinrichtung bei jedem Start, idempotent: erledigte Schritte werden
  # übersprungen, und Sprache, Suchmaschine und Gruppenrechte setzt der Dienst nur
  # bei der Ersteinrichtung — Änderungen in Wiki.js bleiben erhalten. Wartet still,
  # bis DOMAIN, ADMIN_EMAIL und ADMIN_PASSWORD gesetzt sind. Läuft im internen
  # Netz, denn /finalize ist über Caddy gesperrt. Ergebnis: Log des Containers bootstrap.
  bootstrap:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      wiki:
        condition: service_healthy
    command:
      - node
      - --env-file-if-exists=/stack/secrets/public.env
      - /app/bootstrap.mjs
      - --if-configured
      - --locale=de
    environment:
      WIKI_URL: http://wiki:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_NAME: ${DEMO_NAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BOOTSTRAP_ARGS: ${BOOTSTRAP_ARGS:-}
    volumes:
      - stack-secrets:/stack/secrets:ro

  # Tägliches Backup von Postgres und den Secrets ins Volume db-backups. Ohne die
  # Secrets ließen sich die verschlüsselten MCP-Sitzungen aus mcp-backups nicht
  # wieder nutzen. Die Dateien sind nur für ihren Besitzer lesbar (Geheimnisse).
  # Beide Backup-Volumes liegen auf DIESEM Server: regelmäßig nach außen kopieren.
  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    # Ohne root (Audit A-50): uid 1000 liest postgres_password (0644) und das
    # MCP-Secret (0600, gleicher Nutzer) und schreibt in db-backups (siehe init).
    user: "1000:1000"
    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - db-backups:/backups
      - stack-secrets:/stack/secrets:ro
      - mcp-secrets:/stack/mcp-secrets:ro
    networks:
      - db
    entrypoint: ["/bin/sh", "-c"]
    # Erst als .part schreiben, dann umbenennen: ein abgebrochener Lauf zählt nie
    # als Backup und verdrängt keine gute Kopie aus der Rotation.
    command:
      - |
        umask 077
        export PGPASSWORD="$$(cat /stack/secrets/postgres_password)"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          rm -f /backups/*.part
          # 0 oder kein Zahlwert hieße "tail -n +1" = alles löschen: dann 7 (wie mcp-backup).
          keep=$${BACKUP_KEEP:-7}
          case "$$keep" in ''|*[!0-9]*|0) keep=7 ;; esac
          if pg_dump -h db -U wikijs -d wiki -F c -f "/backups/wiki-$$ts.dump.part" && mv "/backups/wiki-$$ts.dump.part" "/backups/wiki-$$ts.dump"; then
            echo "backup ok: wiki-$$ts.dump"
            ls -1t /backups/wiki-*.dump 2>/dev/null | tail -n +$$((keep + 1)) | xargs -r rm --
          else
            rm -f "/backups/wiki-$$ts.dump.part"
            echo "backup FAILED (postgres) at $$ts" >&2
          fi
          if tar -czf "/backups/secrets-$$ts.tar.gz.part" -C /stack secrets mcp-secrets && mv "/backups/secrets-$$ts.tar.gz.part" "/backups/secrets-$$ts.tar.gz"; then
            echo "backup ok: secrets-$$ts.tar.gz"
            ls -1t /backups/secrets-*.tar.gz 2>/dev/null | tail -n +$$((keep + 1)) | xargs -r rm --
          else
            rm -f "/backups/secrets-$$ts.tar.gz.part"
            echo "backup FAILED (secrets) at $$ts" >&2
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  # Tägliches Backup der MCP-Datenbank (Sitzungen, Audit-Log) ins Volume
  # mcp-backups — ohne Netz, als unprivilegierter Nutzer, nichts wird nachinstalliert.
  mcp-backup:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "/app/sqlite-backup.mjs"]
    environment:
      MCP_DB: /data/mcp.sqlite
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - mcp-data:/data
      - mcp-backups:/backups
    # Der Healthcheck des Images prüft den MCP-Server, der hier nicht läuft.
    healthcheck:
      disable: true

  # Routing wie deploy/caddy/Caddyfile (init schreibt es mit eingesetzter DOMAIN).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
      wiki:
        condition: service_started
      mcp:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command: ["caddy", "run", "--config", "/stack/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    volumes:
      - stack-caddy:/stack/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  db:
    internal: true

volumes:
  stack-secrets:
  mcp-secrets:
  stack-caddy:
  db-data:
  db-backups:
  mcp-data:
  mcp-backups:
  caddy-data:
  caddy-config:
