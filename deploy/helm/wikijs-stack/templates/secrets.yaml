{{- if not .Values.secrets.existingSecret }}
{{- /*
Generated once, then kept: on upgrades the existing values are read back (lookup), and
"keep" leaves the Secret in place on uninstall — the database was initialised with this
password, a new one would lock Wiki.js out of its own data.
*/}}
{{- $name := include "stack.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  MCP_SESSION_SECRET: {{ get $data "MCP_SESSION_SECRET" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- if and .Values.admin.password (not .Values.admin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stack.adminSecretName" . }}
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
{{- end }}
