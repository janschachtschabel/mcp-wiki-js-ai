{{- if .Values.ingress.enabled }}
{{- $fullname := include "stack.fullname" . }}
{{- $domain := include "stack.domain" . }}
{{- /*
Audit A-02: Wiki.js (Express) matches /finalize case-insensitively, Ingress paths are
case-sensitive — /FINALIZE would slip past the Exact/Prefix block below. With Traefik a
Middleware on the wiki router rewrites every spelling to a harmless path. ingress-nginx
has no per-path regex (use-regex turns EVERY path of the host into a case-insensitive
prefix regex, so Exact /me would also catch /meeting); see the chart README.
*/}}
{{- $traefik := eq (toString .Values.ingress.className) "traefik" }}
{{- $wikiAnnotations := merge (deepCopy .Values.ingress.wikiAnnotations) .Values.ingress.annotations }}
{{- $mcpAnnotations := merge (deepCopy .Values.ingress.mcpAnnotations) .Values.ingress.annotations }}
{{- if $traefik }}
{{- $block := printf "%s-%s-setup-block@kubernetescrd" .Release.Namespace $fullname }}
{{- $headers := printf "%s-%s-headers@kubernetescrd" .Release.Namespace $fullname }}
{{- $key := "traefik.ingress.kubernetes.io/router.middlewares" }}
{{- $existing := get $wikiAnnotations $key }}
{{- $_ := set $wikiAnnotations $key (ternary (printf "%s,%s" $block $headers) (printf "%s,%s,%s" $block $headers $existing) (empty $existing)) }}
{{- $existingMcp := get $mcpAnnotations $key }}
{{- $_ := set $mcpAnnotations $key (ternary $headers (printf "%s,%s" $headers $existingMcp) (empty $existingMcp)) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-setup-block
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "wiki") | nindent 4 }}
spec:
  replacePathRegex:
    regex: "(?i)^/finalize(/.*)?$"
    replacement: /finalize-blocked
---
# Same security headers as the Compose variants (A-49). ingress-nginx: set them in the
# controller ConfigMap (HSTS is on there by default with TLS) — see the chart README.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-headers
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "wiki") | nindent 4 }}
spec:
  headers:
    {{- if .Values.ingress.tls.enabled }}
    stsSeconds: 31536000
    {{- end }}
    contentTypeNosniff: true
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
---
{{- end }}
{{- /*
Two Ingress objects on the same host: one for the MCP paths (+ the blocked setup
wizard), one for Wiki.js on "/". Separate objects let the MCP one carry its own
annotations — Traefik ranks routers by rule length, so without an explicit priority
the wiki's PathPrefix(`/`) would beat short exact paths such as Path(`/me`). nginx
merges both and picks the most specific path anyway.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-mcp
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "mcp") | nindent 4 }}
  {{- with $mcpAnnotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts: [{{ $domain | quote }}]
    secretName: {{ default (printf "%s-tls" $fullname) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ $domain | quote }}
    http:
      paths:
      {{- range .Values.ingress.mcpPaths }}
      {{- /* Plain strings are accepted too (pathType Prefix). */}}
      {{- $p := ternary (dict "path" . "pathType" "Prefix") . (kindIs "string" .) }}
      - path: {{ $p.path }}
        pathType: {{ default "Prefix" $p.pathType }}
        backend:
          service:
            name: {{ $fullname }}-mcp
            port:
              name: http
      {{- end }}
      # Wiki.js setup wizard (creates the first admin account for anyone until setup is
      # done): never reachable from outside. The MCP server answers every path except
      # /mcp with 404; the first-run setup runs as a Job inside the cluster.
      {{- range list (dict "path" "/finalize" "pathType" "Exact") (dict "path" "/finalize/" "pathType" "Prefix") }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $fullname }}-mcp
            port:
              name: http
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-wiki
  labels: {{ include "stack.labels" (dict "ctx" $ "component" "wiki") | nindent 4 }}
  {{- with $wikiAnnotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts: [{{ $domain | quote }}]
    secretName: {{ default (printf "%s-tls" $fullname) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ $domain | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullname }}-wiki
            port:
              name: http
{{- end }}
