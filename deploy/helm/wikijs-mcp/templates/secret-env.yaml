{{- if and .Values.config.existingSecret .Values.config.extraSecretEnv }}
{{- fail "config.extraSecretEnv is ignored with config.existingSecret (the chart creates no Secret then) — add those keys to the existing Secret instead" }}
{{- end }}
{{- if not .Values.config.existingSecret }}
{{- with .Values.config.oauth.sessionSecret }}
{{- /* Same rule as the server (lib/oauth/crypto.ts): trimmed value, min 16 chars. */}}
{{- if lt (len (trim (toString .))) 16 }}
{{- fail "config.oauth.sessionSecret must be at least 16 characters (the server refuses to start otherwise) — generate one with: openssl rand -base64 32" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wikijs-mcp.fullname" . }}-env
  labels: {{ include "wikijs-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.oauth.sessionSecret }}
  MCP_SESSION_SECRET: {{ .Values.config.oauth.sessionSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.wikijs.token }}
  WIKIJS_TOKEN: {{ .Values.config.wikijs.token | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraSecretEnv }}
  {{ $key }}: {{ toString $value | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.config.oauth.sessionSecret) (not .Values.config.wikijs.token) }}
  # Neither OAuth nor a single-tenant token configured — clients must bring
  # their own credentials per request (BYOK headers / URL params).
  {{- end }}
{{- end }}
