name: CI — Typecheck, Tests & Build

# Sanity-Checks:
# - TypeScript kompiliert (tsc --noEmit)
# - Offline-Testsuiten (Policy, Navigation, Semaphore, Context, OAuth,
#   Guardrails, Routing, Format)
# - Next.js-Produktionsbuild läuft durch (standalone output)
#
# Aufgerufen als GATE vom Docker-Build (workflow_call) — so laufen die Checks
# auch bei Release-Tags, bevor ein Image gepusht wird. workflow_dispatch für
# manuelle Läufe.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: npm ci / Tests führen Dependency-Lifecycle-Skripte aus —
# der Job braucht nur Lese-Zugriff auf das Repo.
permissions:
  contents: read

env:
  # Node 24 als Action-Runtime — Node 20 wird in GitHub-Runnern
  # ab Q3 2026 entfernt.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  server:
    name: MCP-Server — Typecheck + Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-for-wiki-js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24: node:sqlite (OAuth-Session-Store) ist hier stabil —
          # gleiche Major-Version wie das Docker-Runtime-Image.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-for-wiki-js/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Gate auf HIGH+: blockt ernste CVEs in Runtime-Deps, lässt fixbare
      # Moderates (oft transitiv, brauchen Parent-Patch) als Warnung durch.
      - name: Security-Audit (Runtime-Deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Offline-Tests
        run: npm test

      - name: Build (standalone)
        run: npm run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js || (echo "standalone server.js fehlt" && exit 1)
          echo "OK: standalone bundle gebaut"

  # Audit 2026-10-23 A-33: Compose-Dateien und Helm-Charts werden mit jedem Build
  # gerendert — ein Tippfehler fällt hier auf, nicht erst beim Deploy im Panel.
  # Die MCP-Pfadliste aller Routing-Dateien gleicht die Offline-Suite ab (test:deploy).
  deploy:
    name: Deploy-Artefakte — Compose + Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Panel-Dateien ohne jede Variable: "Compose from URL" startet sie genau so.
      - name: Compose-Dateien rendern (ohne Variablen)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/standalone/full/docker-compose.yml config -q
          docker compose -f deploy/standalone/mcp-only/docker-compose.yml config -q
          echo "OK: Panel-Dateien ohne Variablen"

      - name: Compose-Dateien rendern (Selbstbau)
        env:
          DOMAIN: ci.example.org
          POSTGRES_PASSWORD: ci-only
          MCP_SESSION_SECRET: ci-only-secret-0123456789abcdef
        run: |
          docker compose -f docker-compose.build.yml config -q
          docker compose -f docker-compose.build.yml -f docker-compose.local.yml config -q
          echo "OK: Selbstbau-Dateien"

      - name: Helm-Charts prüfen
        run: |
          stack="--set domain=ci.example.org --set admin.email=ci@example.org --set admin.existingSecret=ci-admin"
          helm lint deploy/helm/wikijs-stack $stack
          helm template ci deploy/helm/wikijs-stack $stack > /dev/null
          helm template ci deploy/helm/wikijs-stack $stack --set ingress.className=traefik             --set 'networkPolicy.ingressFrom[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name=kube-system' > /dev/null
          mcp="--set config.wikijs.url=http://wiki:3000 --set config.oauth.publicBaseUrl=https://ci.example.org --set config.oauth.sessionSecret=ci-only-secret-0123456789abcdef"
          helm lint deploy/helm/wikijs-mcp $mcp
          helm template ci deploy/helm/wikijs-mcp $mcp > /dev/null
          echo "OK: Helm-Charts"
