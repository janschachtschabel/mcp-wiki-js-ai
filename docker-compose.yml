# =============================================================================
# Wiki.js + MCP-Server — Komplett-Stack hinter einem vorhandenen Traefik
# =============================================================================
# Für Docker-Panels mit Compose-Import aus dem GitHub-Repository (z. B. „Compose
# from URL“): Sie lesen nur diese Datei im Hauptordner und kopieren .env.example
# als .env. Auf dem Server läuft dort schon Traefik auf den Ports 80/443 und
# übernimmt HTTPS und Zertifikate. Nichts wird gebaut, keine Repo-Datei
# eingebunden; der MCP-Server kommt als fertiges Image aus GHCR.
#
# Ablauf im Panel:
#   1. Bereitstellen, ohne Variablen. Postgres-Passwort und MCP_SESSION_SECRET
#      erzeugt der Dienst init beim ersten Start selbst (Volumes stack-secrets
#      und mcp-secrets).
#   2. Projekt bearbeiten, in der .env setzen und neu bereitstellen:
#        DOMAIN          nur der Hostname, z. B. wiki.example.org (DNS → Server)
#        ADMIN_EMAIL     erstes Admin-Konto, wird dann automatisch angelegt
#        ADMIN_PASSWORD  nach der Einrichtung wieder entfernen
#
# Traefik-Anbindung (Defaults = üblicher Panel-Traefik im Host-Modus mit HTTPS-Eingang
# websecure und Zertifikatsdienst letsencrypt):
#   TRAEFIK_ENTRYPOINT=websecure  TRAEFIK_CERTRESOLVER=letsencrypt
#   TRAEFIK_NETWORK=wikijs-web — nur ändern, wenn Traefik in einem eigenen
#   Docker-Netz läuft (dann dessen Namen, z. B. traefik-proxy); im Host-Modus
#   erreicht Traefik das Netz des Stacks direkt.
#   INSTANCE=wikijs — Präfix der Traefik-Router; für eine ZWEITE Installation auf
#   demselben Server (z. B. Staging) einen anderen Namen setzen.
# Traefik routet die MCP-Pfade an den MCP-Server, alles andere an Wiki.js, und
# sperrt den Setup-Endpunkt /finalize (Ersteinrichtung nur über bootstrap).
#
# Backups: täglich Postgres + Secrets ins Volume db-backups, die MCP-Datenbank ins
# Volume mcp-backups. Beide liegen auf DIESEM Server — für den Ausfall des Servers
# regelmäßig nach außen kopieren (Anleitung: docs/installation-it.md, „Backup“).
#
# Andere Varianten:
#   ohne Traefik, eigener Caddy auf 80/443:  deploy/standalone/full/docker-compose.yml
#   nur MCP neben bestehendem Wiki:          deploy/standalone/mcp-only/docker-compose.yml
#   Image selbst bauen (Repo-Checkout):      docker-compose.build.yml
#
# Bewusst schlicht für Web-Editoren: keine Pflicht-Variablen, keine Tabs, keine
# YAML-Anker; Logik (Init, Ersteinrichtung, Backup) liegt im MCP-Image.
# Routing hier und in deploy/caddy/Caddyfile gemeinsam ändern.

services:
  # Erzeugt beim ersten Start die Geheimnisse und leitet bei jedem Start die
  # öffentliche Adresse aus DOMAIN ab; beendet sich danach.
  init:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/standalone-init.mjs"]
    environment:
      DOMAIN: ${DOMAIN:-}
      # Hinter Traefik: DOMAIN ohne Port.
      INIT_ROUTER: traefik
      # MCP_SESSION_SECRET in ein eigenes Volume, das Wiki.js nicht einbindet.
      MCP_SECRETS_DIR: /stack/mcp-secrets
    volumes:
      - stack-secrets:/stack/secrets
      - mcp-secrets:/stack/mcp-secrets

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD_FILE: /stack/secrets/postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - stack-secrets:/stack/secrets:ro
    networks:
      db:
        # Eindeutiger Name im Stack: "db" könnte auch ein Dienst einer anderen
        # App im gemeinsamen Traefik-Netz heißen.
        aliases:
          - wikijs-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki:
    image: requarks/wiki:2
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # Ohne eigene config.yml gilt der DB-Pool des Images (max. 10 Verbindungen);
    # WIKIJS_MAX_CONCURRENCY beim MCP ist deshalb niedriger gesetzt.
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS_FILE: /stack/secrets/postgres_password
      DB_NAME: wiki
    # Nur das Volume mit DB-Passwort und öffentlicher Adresse — das MCP-Secret
    # liegt in mcp-secrets und ist für Wiki.js nicht erreichbar.
    volumes:
      - stack-secrets:/stack/secrets:ro
    networks:
      default:
      backend:
        aliases:
          - wikijs-upstream
      db:
    # /healthz antwortet auch im Setup-Modus; der erste Start migriert die Datenbank.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-wikijs-web}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.priority=1"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.middlewares=${INSTANCE:-wikijs}-setup-block,${INSTANCE:-wikijs}-wiki-headers"
      - "traefik.http.routers.${INSTANCE:-wikijs}-wiki.service=${INSTANCE:-wikijs}-wiki"
      - "traefik.http.services.${INSTANCE:-wikijs}-wiki.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-wiki-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-wiki-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-wiki-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-wiki-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Setup-Assistent (/finalize legt das erste Admin-Konto an) in JEDER Schreibweise
      # sperren — Wiki.js (Express) vergleicht ohne Groß-/Kleinschreibung (Audit A-02).
      # Auf dem Wiki-Router selbst, damit die Sperre nicht davon abhängt, dass Traefik
      # den MCP-Container schon als gesund routet (während dessen Start fiele /finalize
      # sonst an Wiki.js). Wiki.js antwortet auf den umgeschriebenen Pfad mit 404.
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-setup-block.replacepathregex.regex=(?i)^/finalize(/.*)?$$"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-setup-block.replacepathregex.replacement=/finalize-blocked"

  mcp:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
      wiki:
        condition: service_started
    # MCP_SESSION_SECRET und PUBLIC_BASE_URL kommen aus den Dateien von init.
    command:
      - node
      - --env-file-if-exists=/stack/mcp-secrets/session.env
      - --env-file-if-exists=/stack/secrets/public.env
      - server.js
    environment:
      WIKIJS_URL: http://wikijs-upstream:3000
      MCP_DATA_DIR: /data
      WIKIJS_PERMISSION_PRESET: ${WIKIJS_PERMISSION_PRESET:-full}
      WIKIJS_OAUTH_ROLE: ${WIKIJS_OAUTH_ROLE:-wiki}
      WIKIJS_BLOCKED_TAGS: ${WIKIJS_BLOCKED_TAGS:-kein-ki}
      WIKIJS_AUDIT: ${WIKIJS_AUDIT:-true}
      WIKIJS_MAX_CONCURRENCY: ${WIKIJS_MAX_CONCURRENCY:-6}
      MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - mcp-data:/data
      - stack-secrets:/stack/secrets:ro
      - mcp-secrets:/stack/mcp-secrets:ro
    networks:
      - default
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-wikijs-web}"
      # MCP-Pfade (wie @mcp in deploy/caddy/Caddyfile) gehen an den MCP-Server.
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.rule=Host(`${DOMAIN:-}`) && (Path(`/mcp`) || PathPrefix(`/mcp/`) || PathPrefix(`/oauth/`) || Path(`/me`) || PathPrefix(`/me/`) || Path(`/api/health`) || PathPrefix(`/_next/`) || PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/oauth-protected-resource`) || Path(`/.well-known/mcp.json`))"
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.priority=100"
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.middlewares=${INSTANCE:-wikijs}-mcp-headers"
      - "traefik.http.routers.${INSTANCE:-wikijs}-mcp.service=${INSTANCE:-wikijs}-mcp"
      # Setup-Endpunkt von Wiki.js nie von außen: geht an den MCP-Server, der
      # jeden Pfad außer /mcp mit 404 beantwortet.
      - "traefik.http.routers.${INSTANCE:-wikijs}-setup.rule=Host(`${DOMAIN:-}`) && (Path(`/finalize`) || PathPrefix(`/finalize/`))"
      - "traefik.http.routers.${INSTANCE:-wikijs}-setup.priority=100"
      - "traefik.http.routers.${INSTANCE:-wikijs}-setup.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-setup.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${INSTANCE:-wikijs}-setup.service=${INSTANCE:-wikijs}-mcp"
      # Alle anderen Schreibweisen fängt die Middleware setup-block am Wiki-Router.
      - "traefik.http.services.${INSTANCE:-wikijs}-mcp.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-mcp-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-mcp-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${INSTANCE:-wikijs}-mcp-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  # Ersteinrichtung bei jedem Start, idempotent: erledigte Schritte werden
  # übersprungen, und Sprache, Suchmaschine und Gruppenrechte setzt der Dienst nur
  # bei der Ersteinrichtung — Änderungen in Wiki.js bleiben erhalten. Wartet still,
  # bis DOMAIN, ADMIN_EMAIL und ADMIN_PASSWORD gesetzt sind. Läuft im internen
  # Netz. Ergebnis: Log des Containers bootstrap.
  bootstrap:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      wiki:
        condition: service_healthy
    command:
      - node
      - --env-file-if-exists=/stack/secrets/public.env
      - /app/bootstrap.mjs
      - --if-configured
      - --locale=de
    environment:
      WIKI_URL: http://wikijs-upstream:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_NAME: ${DEMO_NAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BOOTSTRAP_ARGS: ${BOOTSTRAP_ARGS:-}
    volumes:
      - stack-secrets:/stack/secrets:ro
    networks:
      - backend

  # Tägliches Backup von Postgres und den Secrets ins Volume db-backups. Ohne die
  # Secrets ließen sich die verschlüsselten MCP-Sitzungen aus mcp-backups nicht
  # wieder nutzen. Die Dateien sind nur für root lesbar (sie enthalten Geheimnisse).
  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - db-backups:/backups
      - stack-secrets:/stack/secrets:ro
      - mcp-secrets:/stack/mcp-secrets:ro
    networks:
      - db
    entrypoint: ["/bin/sh", "-c"]
    # Erst als .part schreiben, dann umbenennen: ein abgebrochener Lauf zählt nie
    # als Backup und verdrängt keine gute Kopie aus der Rotation.
    command:
      - |
        umask 077
        export PGPASSWORD="$$(cat /stack/secrets/postgres_password)"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          rm -f /backups/*.part
          if pg_dump -h wikijs-db -U wikijs -d wiki -F c -f "/backups/wiki-$$ts.dump.part" && mv "/backups/wiki-$$ts.dump.part" "/backups/wiki-$$ts.dump"; then
            echo "backup ok: wiki-$$ts.dump"
            ls -1t /backups/wiki-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          else
            rm -f "/backups/wiki-$$ts.dump.part"
            echo "backup FAILED (postgres) at $$ts" >&2
          fi
          if tar -czf "/backups/secrets-$$ts.tar.gz.part" -C /stack secrets mcp-secrets && mv "/backups/secrets-$$ts.tar.gz.part" "/backups/secrets-$$ts.tar.gz"; then
            echo "backup ok: secrets-$$ts.tar.gz"
            ls -1t /backups/secrets-*.tar.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          else
            rm -f "/backups/secrets-$$ts.tar.gz.part"
            echo "backup FAILED (secrets) at $$ts" >&2
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  # Tägliches Backup der MCP-Datenbank (Sitzungen, Audit-Log) ins Volume
  # mcp-backups — ohne Netz, als unprivilegierter Nutzer, nichts wird nachinstalliert.
  mcp-backup:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "/app/sqlite-backup.mjs"]
    environment:
      MCP_DB: /data/mcp.sqlite
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - mcp-data:/data
      - mcp-backups:/backups
    # Der Healthcheck des Images prüft den MCP-Server, der hier nicht läuft.
    healthcheck:
      disable: true

networks:
  # Eingang: Netz mit festem Namen, über das Traefik Wiki.js und den MCP-Server
  # erreicht (Label traefik.docker.network). Wird angelegt, falls es fehlt;
  # gibt es schon ein Netz dieses Namens (z. B. das von Traefik), wird es genutzt.
  default:
    name: ${TRAEFIK_NETWORK:-wikijs-web}
  # Intern zwischen MCP, Bootstrap und Wiki.js. Der Name des Stacks wird
  # vorangestellt, der Alias wikijs-upstream ist deshalb eindeutig — auch wenn
  # mehrere Installationen dasselbe Traefik-Netz nutzen.
  backend:
    internal: true
  db:
    internal: true

volumes:
  stack-secrets:
  mcp-secrets:
  db-data:
  db-backups:
  mcp-data:
  mcp-backups:
