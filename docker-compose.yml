# =============================================================================
# Wiki.js + MCP-Server — Komplett-Stack hinter einem vorhandenen Traefik
# =============================================================================
# Für Docker-Panels mit Compose-Import aus dem GitHub-Repository (z. B. „Compose
# from URL“): Sie lesen nur diese Datei im Hauptordner und kopieren .env.example
# als .env. Auf dem Server läuft dort schon Traefik auf den Ports 80/443 und
# übernimmt HTTPS und Zertifikate. Nichts wird gebaut, keine Repo-Datei
# eingebunden; der MCP-Server kommt als fertiges Image aus GHCR.
#
# Ablauf im Panel:
#   1. Bereitstellen, ohne Variablen. Postgres-Passwort und MCP_SESSION_SECRET
#      erzeugt der Dienst init beim ersten Start selbst (Volume stack-secrets).
#   2. Projekt bearbeiten, in der .env setzen und neu bereitstellen:
#        DOMAIN          nur der Hostname, z. B. wiki.example.org (DNS → Server)
#        ADMIN_EMAIL     erstes Admin-Konto, wird dann automatisch angelegt
#        ADMIN_PASSWORD  nach der Einrichtung wieder entfernen
#
# Traefik-Anbindung (Defaults = üblicher Panel-Traefik im Host-Modus mit HTTPS-Eingang
# websecure und Zertifikatsdienst letsencrypt):
#   TRAEFIK_ENTRYPOINT=websecure  TRAEFIK_CERTRESOLVER=letsencrypt
#   TRAEFIK_NETWORK=wikijs-web — nur ändern, wenn Traefik in einem eigenen
#   Docker-Netz läuft (dann dessen Namen, z. B. traefik-proxy); im Host-Modus
#   erreicht Traefik das Netz des Stacks direkt.
# Traefik routet die MCP-Pfade an den MCP-Server, alles andere an Wiki.js, und
# sperrt den Setup-Endpunkt /finalize (Ersteinrichtung nur über bootstrap).
#
# Andere Varianten:
#   ohne Traefik, eigener Caddy auf 80/443:  deploy/standalone/full/docker-compose.yml
#   nur MCP neben bestehendem Wiki:          deploy/standalone/mcp-only/docker-compose.yml
#   Image selbst bauen (Repo-Checkout):      docker-compose.build.yml
#
# Bewusst schlicht für Web-Editoren: keine Pflicht-Variablen, keine Tabs, keine
# YAML-Anker; Logik (Init, Ersteinrichtung) liegt im MCP-Image.
# Routing hier und in deploy/caddy/Caddyfile gemeinsam ändern.

services:
  # Erzeugt beim ersten Start die Geheimnisse und leitet bei jedem Start die
  # öffentliche Adresse aus DOMAIN ab; beendet sich danach.
  init:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/standalone-init.mjs"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - stack-secrets:/stack/secrets

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD_FILE: /stack/secrets/postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - stack-secrets:/stack/secrets:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki:
    image: requarks/wiki:2
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # Ohne eigene config.yml gilt der DB-Pool des Images (max. 10 Verbindungen);
    # WIKIJS_MAX_CONCURRENCY beim MCP ist deshalb niedriger gesetzt.
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS_FILE: /stack/secrets/postgres_password
      DB_NAME: wiki
    volumes:
      - stack-secrets:/stack/secrets:ro
    networks:
      - default
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-wikijs-web}"
      - "traefik.http.routers.wikijs-wiki.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.wikijs-wiki.priority=1"
      - "traefik.http.routers.wikijs-wiki.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.wikijs-wiki.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.wikijs-wiki.middlewares=wikijs-setup-block,wikijs-wiki-headers"
      - "traefik.http.routers.wikijs-wiki.service=wikijs-wiki"
      - "traefik.http.services.wikijs-wiki.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.wikijs-wiki-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.wikijs-wiki-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.wikijs-wiki-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.wikijs-wiki-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Setup-Assistent (/finalize legt das erste Admin-Konto an) in JEDER Schreibweise
      # sperren — Wiki.js (Express) vergleicht ohne Groß-/Kleinschreibung (Audit A-02).
      # Auf dem Wiki-Router selbst, damit die Sperre nicht davon abhängt, dass Traefik
      # den MCP-Container schon als gesund routet (während dessen Start fiele /finalize
      # sonst an Wiki.js). Wiki.js antwortet auf den umgeschriebenen Pfad mit 404.
      - "traefik.http.middlewares.wikijs-setup-block.replacepathregex.regex=(?i)^/finalize(/.*)?$$"
      - "traefik.http.middlewares.wikijs-setup-block.replacepathregex.replacement=/finalize-blocked"

  mcp:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
      wiki:
        condition: service_started
    # MCP_SESSION_SECRET und PUBLIC_BASE_URL kommen aus den Dateien von init.
    command:
      - node
      - --env-file-if-exists=/stack/secrets/session.env
      - --env-file-if-exists=/stack/secrets/public.env
      - server.js
    environment:
      WIKIJS_URL: http://wiki:3000
      MCP_DATA_DIR: /data
      WIKIJS_PERMISSION_PRESET: ${WIKIJS_PERMISSION_PRESET:-full}
      WIKIJS_OAUTH_ROLE: ${WIKIJS_OAUTH_ROLE:-wiki}
      WIKIJS_BLOCKED_TAGS: ${WIKIJS_BLOCKED_TAGS:-kein-ki}
      WIKIJS_AUDIT: ${WIKIJS_AUDIT:-true}
      WIKIJS_MAX_CONCURRENCY: ${WIKIJS_MAX_CONCURRENCY:-6}
      MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - mcp-data:/data
      - stack-secrets:/stack/secrets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-wikijs-web}"
      # MCP-Pfade (wie @mcp in deploy/caddy/Caddyfile) gehen an den MCP-Server.
      - "traefik.http.routers.wikijs-mcp.rule=Host(`${DOMAIN:-}`) && (Path(`/mcp`) || PathPrefix(`/mcp/`) || PathPrefix(`/oauth/`) || Path(`/me`) || PathPrefix(`/me/`) || Path(`/api/health`) || PathPrefix(`/_next/`) || PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/oauth-protected-resource`) || Path(`/.well-known/mcp.json`))"
      - "traefik.http.routers.wikijs-mcp.priority=100"
      - "traefik.http.routers.wikijs-mcp.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.wikijs-mcp.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.wikijs-mcp.middlewares=wikijs-mcp-headers"
      - "traefik.http.routers.wikijs-mcp.service=wikijs-mcp"
      # Setup-Endpunkt von Wiki.js nie von außen: geht an den MCP-Server, der
      # jeden Pfad außer /mcp mit 404 beantwortet.
      - "traefik.http.routers.wikijs-setup.rule=Host(`${DOMAIN:-}`) && (Path(`/finalize`) || PathPrefix(`/finalize/`))"
      - "traefik.http.routers.wikijs-setup.priority=100"
      - "traefik.http.routers.wikijs-setup.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.wikijs-setup.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.wikijs-setup.service=wikijs-mcp"
      # Alle anderen Schreibweisen fängt die Middleware wikijs-setup-block am Wiki-Router.
      - "traefik.http.services.wikijs-mcp.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.wikijs-mcp-headers.headers.stsSeconds=31536000"

  # Ersteinrichtung bei jedem Start, idempotent (erledigte Schritte werden
  # übersprungen). Wartet still, bis DOMAIN, ADMIN_EMAIL und ADMIN_PASSWORD
  # gesetzt sind. Läuft im internen Netz. Ergebnis: Log des Containers bootstrap.
  bootstrap:
    image: ${MCP_IMAGE:-ghcr.io/janschachtschabel/mcp-wiki-js-ai:main}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      wiki:
        condition: service_started
    command:
      - node
      - --env-file-if-exists=/stack/secrets/public.env
      - /app/bootstrap.mjs
      - --if-configured
      - --locale=de
    environment:
      WIKI_URL: http://wiki:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_NAME: ${DEMO_NAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BOOTSTRAP_ARGS: ${BOOTSTRAP_ARGS:-}
    volumes:
      - stack-secrets:/stack/secrets:ro

  # Tägliches Backup von Postgres und MCP-SQLite ins Volume db-backups.
  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - db-backups:/backups
      - mcp-data:/mcp-data
      - stack-secrets:/stack/secrets:ro
    networks:
      - default
      - db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$(cat /stack/secrets/postgres_password)"
        apk add --no-cache sqlite >/dev/null 2>&1 || true
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db -U wikijs -d wiki -F c -f "/backups/wiki-$$ts.dump"; then
            echo "backup ok: wiki-$$ts.dump"
            ls -1t /backups/wiki-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          else
            echo "backup FAILED (postgres) at $$ts" >&2
          fi
          if [ -f /mcp-data/mcp.sqlite ]; then
            if sqlite3 /mcp-data/mcp.sqlite ".backup '/backups/mcp-$$ts.sqlite'"; then
              echo "backup ok: mcp-$$ts.sqlite"
              ls -1t /backups/mcp-*.sqlite 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
            else
              echo "backup FAILED (mcp sqlite) at $$ts" >&2
            fi
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

networks:
  # Eigenes Netz mit festem Namen, über das Traefik Wiki.js und den MCP-Server
  # erreicht (Label traefik.docker.network). Wird angelegt, falls es fehlt;
  # gibt es schon ein Netz dieses Namens (z. B. das von Traefik), wird es genutzt.
  default:
    name: ${TRAEFIK_NETWORK:-wikijs-web}
  db:
    internal: true

volumes:
  stack-secrets:
  db-data:
  db-backups:
  mcp-data:
